<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pricing Component</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-white min-h-screen overflow-x-hidden relative">

  <!-- Animated Gradient Background (Greyscale/Monochrome Radial Theme) -->
  <div id="background-gradient-container" aria-hidden="true">
    <div id="background-gradient"></div>
  </div>

  <!-- Loading Screen Overlay with Blur and Loading Animation -->
  <div id="loading-screen" aria-live="polite" aria-label="Loading content">
    <div class="loader-card flex flex-col items-center justify-center">
      <svg
        width="56"
        height="56"
        viewBox="0 0 24 24"
        xmlns="http://www.w3.org/2000/svg"
        class="text-black w-14 h-14"
      >
        <circle cx="4" cy="12" r="2" fill="currentColor">
          <animate
            id="spinner_qFRN"
            begin="0;spinner_OcgL.end+0.25s"
            attributeName="cy"
            calcMode="spline"
            dur="0.6s"
            values="12;6;12"
            keySplines=".33,.66,.66,1;.33,0,.66,.33"
          />
        </circle>
        <circle cx="12" cy="12" r="2" fill="currentColor">
          <animate
            begin="spinner_qFRN.begin+0.1s"
            attributeName="cy"
            calcMode="spline"
            dur="0.6s"
            values="12;6;12"
            keySplines=".33,.66,.66,1;.33,0,.66,.33"
          />
        </circle>
        <circle cx="20" cy="12" r="2" fill="currentColor">
          <animate
            id="spinner_OcgL"
            begin="spinner_qFRN.begin+0.2s"
            attributeName="cy"
            calcMode="spline"
            dur="0.6s"
            values="12;6;12"
            keySplines=".33,.66,.66,1;.33,0,.66,.33"
          />
        </circle>
      </svg>
    </div>
  </div>

  <!-- Main Website Content Wrapper -->
  <main id="main-content" class="content-blurred min-h-screen flex items-center justify-end p-8">
    <!-- Right-Aligned Container -->
    <div class="border-2 rounded-[32px] p-3 shadow-md max-w-sm w-full flex flex-col items-center gap-3 bg-white">
      
      <!-- Period Toggle -->
      <div class="rounded-full relative w-full bg-slate-100 p-1.5 flex items-center">
        <button
          id="btn-monthly"
          class="font-semibold rounded-full w-full p-1.5 text-slate-800 z-20 cursor-pointer"
        >
          Monthly
        </button>
        <button
          id="btn-yearly"
          class="font-semibold rounded-full w-full p-1.5 text-slate-800 z-20 cursor-pointer"
        >
          Yearly
        </button>
        <div
          id="period-indicator"
          class="p-1.5 flex items-center justify-center absolute inset-0 w-1/2 z-10"
          style="transform: translateX(0%); transition: transform 0.3s ease;"
        >
          <div class="bg-white shadow-sm rounded-full w-full h-full"></div>
        </div>
      </div>

      <!-- Plan Cards List -->
      <div class="w-full relative flex flex-col items-center justify-center gap-3">
        
        <!-- Option 0: Free -->
        <div
          class="plan-card w-full flex justify-between cursor-pointer border-2 p-4 rounded-2xl z-10"
          style="border-color: transparent; transition: border-color 0.3s ease;"
          data-index="0"
        >
          <div class="flex flex-col items-start">
            <p class="font-semibold text-xl text-gray-950">Free</p>
            <p class="text-slate-500 text-md">
              <span class="text-black font-medium">$0.00</span>/month
            </p>
          </div>
          <div class="radio-border border-2 size-6 rounded-full mt-0.5 p-1 flex items-center justify-center" style="border-color: #000; transition: border-color 0.3s ease;">
            <div class="radio-dot size-3 bg-black rounded-full" style="opacity: 1; transition: opacity 0.3s ease;"></div>
          </div>
        </div>

        <!-- Option 1: Starter -->
        <div
          class="plan-card w-full flex justify-between cursor-pointer border-2 p-4 rounded-2xl z-10"
          style="border-color: #9ca3af; transition: border-color 0.3s ease;"
          data-index="1"
        >
          <div class="flex flex-col items-start">
            <p class="font-semibold text-xl flex items-center gap-2 text-gray-950">
              Starter
              <span class="py-1 px-2 block rounded-lg bg-yellow-100 text-yellow-950 text-sm font-normal">
                Popular
              </span>
            </p>
            <p class="text-slate-500 text-md flex items-center">
              <span class="text-black font-medium flex items-center">
                $&nbsp;
                <number-flow id="starter-flow" class="text-black font-medium"></number-flow>
              </span>
              &nbsp;/month
            </p>
          </div>
          <div class="radio-border border-2 size-6 rounded-full mt-0.5 p-1 flex items-center justify-center" style="border-color: #64748b; transition: border-color 0.3s ease;">
            <div class="radio-dot size-3 bg-black rounded-full" style="opacity: 0; transition: opacity 0.3s ease;"></div>
          </div>
        </div>

        <!-- Option 2: Pro -->
        <div
          class="plan-card w-full flex justify-between cursor-pointer border-2 p-4 rounded-2xl z-10"
          style="border-color: #9ca3af; transition: border-color 0.3s ease;"
          data-index="2"
        >
          <div class="flex flex-col items-start">
            <p class="font-semibold text-xl text-gray-950">Pro</p>
            <p class="text-slate-500 text-md flex items-center">
              <span class="text-black font-medium flex items-center">
                $&nbsp;
                <number-flow id="pro-flow" class="text-black font-medium"></number-flow>
              </span>
              &nbsp;/month
            </p>
          </div>
          <div class="radio-border border-2 size-6 rounded-full mt-0.5 p-1 flex items-center justify-center" style="border-color: #64748b; transition: border-color 0.3s ease;">
            <div class="radio-dot size-3 bg-black rounded-full" style="opacity: 0; transition: opacity 0.3s ease;"></div>
          </div>
        </div>

        <!-- Active Outline Indicator -->
        <div
          id="active-card-outline"
          class="w-full h-[88px] absolute top-0 border-[3px] border-black rounded-2xl pointer-events-none z-20"
          style="transform: translateY(0px); transition: transform 0.3s ease;"
        ></div>
      </div>

      <!-- CTA Button -->
      <button class="rounded-full bg-black text-lg text-white w-full p-3 active:scale-95 transition-transform duration-300 cursor-pointer">
        Get Started
      </button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
